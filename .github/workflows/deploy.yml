name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        IMAGE_TAG=latest
        docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG app/

    - name: Push to ECR
      run: |
        IMAGE_TAG=latest
        docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG

    - name: Update Kubernetes Deployment
      run: |
        echo "Updating deployment image..."
        sudo apt-get update -y
        sudo apt-get install -y awscli kubectl
        aws eks update-kubeconfig --name dummy 2>/dev/null || true

        # Replace image and apply deployment
        sed -i "s|image: .*|image: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest|g" infra/deployment.yaml
        kubectl apply -f infra/deployment.yaml
        kubectl apply -f infra/service.yaml

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/devops-lab-app

